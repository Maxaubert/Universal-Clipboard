[package]
name = "uc-s5"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "uc_s5"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32.2", features = ["cli"] }
uc-agent = { path = "../../../crates/uc-agent", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

[workspace]
