<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error motion</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* Page-local styles for errors.html. kit.css stays untouched. */
  /* A stack: every child sits in the same grid cell, so states cross-fade without moving the layout. */
  .stk { display: grid; }
  .stk > * { grid-area: 1 / 1; }
  .stk.c > * { justify-self: center; align-self: center; }
  /* Earlier states of a loop: hidden at rest. The resting markup is always the last, readable state. */
  .p0 { opacity: 0; }
  .txt { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .txt .h-l { text-wrap: balance; max-width: 380px; }
  .red { color: var(--red); }
  .digit > .stk { line-height: 1; }
  .digit .cr { display: flex; }

  /* E1 resting state: the dead code, faded. */
  #e1 .digit { border-color: var(--line); background: rgba(255, 255, 255, 0); color: var(--ink-4); }
  #e1 .msg { min-height: 38px; }

  /* E2 thread inside the Connect button. */
  #e2 .thread {
    position: absolute; left: 22px; right: 22px; bottom: 9px; height: 2px; border-radius: 1px;
    background: rgba(255, 255, 255, 0.6); transform-origin: 0 50%; opacity: 0;
  }
  #e2 .vpnlink { opacity: 1; }

  /* E3 travelling code chip. */
  #e3 .chip {
    position: absolute; left: 0; top: 0; offset-path: path('M 140.8 63.8 Q 189.2 24.2 237.6 63.8');
    offset-rotate: 0deg; offset-distance: 50%;
    height: 24px; padding: 0 8px; border-radius: 7px; background: var(--ink); color: var(--white);
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; white-space: nowrap;
    box-shadow: 0 0 0 0 rgba(180, 35, 24, 0), 0 4px 10px rgba(40, 35, 30, 0.18);
  }

  /* Codebox slots (E4, E5): fixed height so the box never changes size between states. */
  .codebox .slot { width: 256px; height: 66px; }
  .codebox .code .d { display: inline-block; }
  .codebox .code .gap { display: inline-block; width: 0.32em; }
  .boxmsg { color: var(--white); font-size: 14px; font-weight: 600; line-height: 1.4; text-align: center; text-wrap: balance; }
  .boxmsg .soft, .boxmsg.soft { color: var(--red-soft); font-weight: 500; }
  #e4 .lockL { display: flex; align-items: center; gap: 14px; text-align: left; }
  #e4 .lk { flex: none; display: block; overflow: visible; }
  #e4 .lk-ring { stroke-dashoffset: 0.04; }
  #e4 .lk-body { stroke-dashoffset: 0; }

  /* E5 */
  #e5 .qwrap { position: relative; width: 256px; height: 256px; border-radius: var(--r-tile); background: var(--white); }
  #e5 .qwrap .qr { position: absolute; inset: 0; }
  #e5 .qoff { position: absolute; left: 86px; top: 86px; }
  #e5 .w1 { max-width: 230px; }
  #e5 .tries { display: flex; gap: 8px; }
  #e5 .tries i { width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid rgba(255, 210, 204, 0.9); background: rgba(255, 210, 204, 0.9); }
  #e5 .w3 { display: flex; flex-direction: column; align-items: center; }
  #e5 .bar { margin-top: 10px; width: 160px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
  #e5 .bar span { display: block; height: 100%; width: 100%; background: rgba(255, 255, 255, 0.75); transform-origin: 0 50%; transform: scaleX(0.97); }

  /* E6 radar */
  #e6 .tip {
    margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--white);
    border: 1px solid var(--line); border-radius: var(--r-tile); font-size: 14px; line-height: 1.4; color: var(--ink-2);
    text-align: left;
  }
  #e6 .tip svg { flex: none; }
  #e6 .logo { opacity: 0.4; }

  /* E7 signal */
  #e7 .a { opacity: 1; }
  #e7 .t3 { margin-top: 2px; }

  /* E8 home */
  #e8 .note {
    display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--line);
    border-radius: var(--r-tile); padding: 12px 12px 12px 14px;
  }
  #e8 .note-ico { flex: none; width: 22px; height: 22px; }
  #e8 .note-ico svg { display: block; }
  #e8 .note-txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; color: var(--ink-2); }
  #e8 .note-btn { flex: none; min-width: 92px; }
  #e8 .tile .tg { opacity: 0.4; }
  #e8 .tile-name { text-align: center; }

</style>
</head>

<script>
/* errors.html page script. Every option is one timeline: each element gets ONE WAAPI animation that
   spans the whole loop, with keyframes placed at absolute times. That keeps seek exact and avoids
   overlapping fill modes. Under reduced motion, movement (transform, filter, offset) is removed and
   the same states cross-fade; colour and text changes stay. */
(function () {
  'use strict';
  const EO = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const EIO = 'cubic-bezier(0.65, 0, 0.35, 1)';
  const EI = 'cubic-bezier(0.4, 0, 1, 1)';
  const MOVE = ['transform', 'filter', 'offsetDistance'];

  function timeline(ctx, total) {
    const R = ctx.reduced;
    const clean = (p) => { const o = Object.assign({}, p); if (R) MOVE.forEach((k) => delete o[k]); return o; };
    function tl(target, frames) {
      const kf = frames.map(([ms, p, e]) => Object.assign(clean(p), { offset: Math.max(0, Math.min(1, ms / total)), easing: e || 'linear' }));
      if (kf[0].offset > 0) kf.unshift(Object.assign({}, kf[0], { offset: 0, easing: 'linear' }));
      if (kf[kf.length - 1].offset < 1) kf.push(Object.assign({}, kf[kf.length - 1], { offset: 1 }));
      if (R && kf.every((k) => Object.keys(k).length <= 2)) return null; // only offset + easing left
      return ctx.anim(target, kf, { duration: total, easing: 'linear' });
    }
    /* Show an element during intervals [[in, out|null], ...]. rise: px it travels up on the way in. */
    function vis(target, ivs, o = {}) {
      const d = o.d || 420, rise = o.rise == null ? 6 : o.rise, od = o.od || 240, lag = o.lag || 0;
      const off = { opacity: 0, transform: `translateY(${rise}px)` };
      const gone = { opacity: 0, transform: `translateY(${-Math.round(rise * 0.6)}px)` };
      const on = { opacity: 1, transform: 'translateY(0px)' };
      const f = [[0, ivs[0][0] <= 0 ? on : off]];
      ivs.forEach(([a, b]) => {
        if (a > 0) f.push([a + lag, off, EO], [a + lag + d, on]);
        if (b != null) f.push([b, on, EI], [b + od, gone]);
      });
      return tl(target, f);
    }
    /* A short press on a button: scale down and back. */
    function press(target, times) {
      const f = [[0, { transform: 'scale(1)' }]];
      times.forEach((t) => f.push([t, { transform: 'scale(1)' }, EO], [t + 90, { transform: 'scale(0.97)' }, EO], [t + 300, { transform: 'scale(1)' }]));
      return tl(target, f);
    }
    return { tl, vis, press, R };
  }

  /* ---------------- E1 Shake, then clear ---------------- */
  Kit.register('#e1', (ctx) => {
    const T = 7400;
    const { tl, vis, press, R } = timeline(ctx, T);
    const W = 'rgb(255, 255, 255)', W0 = 'rgba(255, 255, 255, 0)';
    const S = (b, act, bg, c) => ({ borderColor: b, boxShadow: `inset 0 0 0 ${act ? 1 : 0}px #1D1C1A`, backgroundColor: bg, color: c });
    const N = S('#BDB8B1', 0, W, '#1D1C1A');
    const RED = S('#B42318', 0, W, '#1D1C1A');
    const ACT = S('#1D1C1A', 1, W, '#1D1C1A');
    const DEAD = S('#D9D6D1', 0, W0, '#6E6A64');
    const digits = ctx.$$('.digit');
    const ty = digits.map((_, i) => 3800 + i * 170);   // typing the new code
    const firstAct = 3350;
    digits.forEach((d, i) => {
      const c = 2400 + (5 - i) * 90;                     // clearing, right to left
      const a = i === 0 ? firstAct : ty[i - 1];
      const dead = 6400 + i * 70;
      tl(d, [[0, N], [1600, N, EO], [1820, RED], [c, RED, EO], [c + 400, N], [a, N, EO], [a + 140, ACT], [ty[i], ACT, EO], [ty[i] + 180, N], [dead, N, EIO], [dead + 700, DEAD]]);
      tl(d.querySelector('.ga'), [[0, { opacity: 1, transform: 'translateY(0px)' }], [c, { opacity: 1, transform: 'translateY(0px)' }, EI], [c + 200, { opacity: 0, transform: 'translateY(5px)' }]]);
      tl(d.querySelector('.gb'), [[0, { opacity: 0, transform: 'scale(0.86)' }], [ty[i], { opacity: 0, transform: 'scale(0.86)' }, EO], [ty[i] + 240, { opacity: 1, transform: 'scale(1)' }]]);
      vis(d.querySelector('.cr'), [[a, ty[i]]], { d: 140, od: 90, rise: 0 });
    });
    // One damped shake, 7 px at most. Under reduced motion the red outline alone says "wrong".
    if (!R) {
      const x = (v) => ({ transform: `translateX(${v}px)` });
      tl('.digits', [[0, x(0)], [1600, x(0), EIO], [1700, x(-7), EIO], [1810, x(6), EIO], [1920, x(-4), EIO], [2030, x(2), EIO], [2140, x(0)]]);
    }
    vis('.m1', [[1700, 3800]]);
    vis('.m2', [[6600, null]]);
    // Button: black, then disabled while the boxes are empty, black again when six digits are in.
    const B = { backgroundColor: '#1D1C1A', color: '#FFFFFF', boxShadow: 'inset 0 0 0 1px rgba(189, 184, 177, 0)' };
    const D = { backgroundColor: '#FFFFFF', color: '#6E6A64', boxShadow: 'inset 0 0 0 1px rgba(189, 184, 177, 1)' };
    tl('.btn', [[0, B], [2500, B, EO], [2800, D], [ty[5] + 60, D, EO], [ty[5] + 360, B]]);
    press('.btn > .stk', [500, 5300]);
    vis('.lb0', [[0, 560], [1600, 5360]], { d: 220, rise: 0, od: 140, lag: 140 });
    vis('.lb1', [[560, 1600], [5360, 6450]], { d: 220, rise: 0, od: 140, lag: 140 });
    vis('.lb2', [[6450, null]], { d: 300, rise: 0, lag: 140 });
  });

  /* ---------------- E2 Thread and tide ---------------- */
  Kit.register('#e2', (ctx) => {
    const T = 7600;
    const { tl, vis, press } = timeline(ctx, T);
    const N = { borderColor: '#BDB8B1', backgroundColor: 'rgb(255, 255, 255)' };
    const RED = { borderColor: '#B42318', backgroundColor: 'rgb(255, 246, 244)' };
    ctx.$$('.digit').forEach((d, i) => {
      const w = 1950 + i * 80, back = 3000 + i * 80;
      tl(d, [[0, N], [w, N, EO], [w + 360, RED], [back, RED, EIO], [back + 1000, N]]);
    });
    // Digits 5 and 6 are fixed by the user (207 to 270).
    ctx.$$('.digit .ga').forEach((g, k) => tl(g, [[0, { opacity: 1, transform: 'translateY(0px)' }], [3900 + k * 220, { opacity: 1, transform: 'translateY(0px)' }, EI], [4060 + k * 220, { opacity: 0, transform: 'translateY(4px)' }]]));
    ctx.$$('.digit .ga + .gb').forEach((g, k) => tl(g, [[0, { opacity: 0, transform: 'scale(0.86)' }], [4000 + k * 220, { opacity: 0, transform: 'scale(0.86)' }, EO], [4240 + k * 220, { opacity: 1, transform: 'scale(1)' }]]));
    vis('.s0', [[0, 1900], [3900, 6600]], { rise: 4, lag: 200 });
    vis('.s1', [[1950, 3850]], { rise: 4, lag: 200 });
    vis('.s2', [[6700, null]], { rise: 4, lag: 200 });
    // The thread: grows slowly while connecting. Wrong code pulls it back; not found leaves it and fades.
    const th = (s, o) => ({ transform: `scaleX(${s})`, opacity: o });
    tl('.thread', [[0, th(0, 0)], [460, th(0, 0), EO], [520, th(0.02, 1), 'cubic-bezier(0.25, 0.6, 0.3, 1)'], [1900, th(0.62, 1), EIO], [2450, th(0, 0.9), EO], [2550, th(0, 0)],
      [4660, th(0, 0), EO], [4720, th(0.02, 1), 'cubic-bezier(0.25, 0.6, 0.3, 1)'], [6600, th(0.9, 1), EO], [7300, th(0.9, 0)]]);
    press('.tbtn > .stk', [400, 4600]);
    vis('.lb0', [[0, 460], [1900, 4660]], { d: 220, rise: 0, od: 140, lag: 140 });
    vis('.lb1', [[460, 1900], [4660, 6600]], { d: 220, rise: 0, od: 140, lag: 140 });
    vis('.lb2', [[6650, null]], { d: 300, rise: 0, lag: 140 });
    vis('.vpnlink', [[6900, null]], { rise: 4 });
  });

  /* ---------------- E3 The code travels ---------------- */
  Kit.register('#e3', (ctx) => {
    const T = 8600;
    const { tl, vis, press } = timeline(ctx, T);
    const ch = (d, o, s, red) => ({ offsetDistance: d + '%', opacity: o, transform: `scale(${s})`,
      boxShadow: `0 0 0 ${red ? 2 : 0}px rgba(180, 35, 24, ${red ? 1 : 0}), 0 4px 10px rgba(40, 35, 30, 0.18)` });
    tl('.chip', [
      [0, ch(31, 0, 0.9)], [300, ch(31, 0, 0.9), EO], [700, ch(33, 1, 1)],
      [700, ch(33, 1, 1), 'cubic-bezier(0.3, 0.2, 0.2, 1)'], [2500, ch(74, 1, 1)],
      [2500, ch(74, 1, 1), EI], [3100, ch(80, 0, 0.92)],        // drifts into the empty outline and dissolves
      [5300, ch(31, 0, 0.9), EO], [5700, ch(33, 1, 1)],
      [5700, ch(33, 1, 1), 'cubic-bezier(0.3, 0.2, 0.2, 1)'], [7000, ch(72, 1, 1)],
      [7000, ch(72, 1, 1), EO], [7300, ch(72, 1, 1, true)],      // red edge at the door
      [7500, ch(72, 1, 1, true), EIO], [8300, ch(35, 1, 1, true)],
      [8300, ch(35, 1, 1, true), EI], [8600, ch(33, 0, 0.92, true)],
    ]);
    // The empty outline breathes once while the chip looks for it.
    tl('.ghost', [[0, { opacity: 0.55 }], [2200, { opacity: 0.55 }, EIO], [2900, { opacity: 0.9 }, EIO], [3700, { opacity: 0.55 }], [4900, { opacity: 0.55 }, EO], [5300, { opacity: 0 }]]);
    tl('.solid', [[0, { opacity: 0 }], [4950, { opacity: 0 }, EO], [5450, { opacity: 1 }]]);
    vis('.p1 .t1', [[2800, 4900]]); vis('.p1 .t2', [[2920, 4900]]); vis('.p1 .t3', [[3040, 4900]]);
    vis('.p2 .t1', [[7300, null]]); vis('.p2 .t2', [[7420, null]]);
    press('.btn > .stk', [4600]);
    vis('.lb0', [[0, 7300]], { d: 220, rise: 0, od: 140, lag: 140 });
    vis('.lb1', [[7300, null]], { d: 300, rise: 0, lag: 140 });
  });

  /* ---------------- E4 The code goes, a lock closes ---------------- */
  Kit.register('#e4', (ctx) => {
    const T = 8600;
    const { tl, vis } = timeline(ctx, T);
    vis('.codeL', [[0, 2900]], { od: 10, rise: 0 });
    vis('.tried', [[700, 2200]], { rise: 4 });
    ctx.$$('.codeL .d').forEach((d, i) => {
      const t = 2200 + i * 80;
      tl(d, [[0, { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0px)' }], [t, { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0px)' }, EI], [t + 520, { opacity: 0, filter: 'blur(4px)', transform: 'translateY(-8px)' }]]);
    });
    vis('.deadL', [[2900, 4700]]);
    vis('.lockL', [[4900, null]], { d: 300, rise: 0 });
    tl('.lk-body', [[0, { strokeDashoffset: 1 }], [4950, { strokeDashoffset: 1 }, EIO], [5550, { strokeDashoffset: 0 }]]);
    tl('.lk-shackle', [[0, { opacity: 0, transform: 'translateY(-5px)' }], [5000, { opacity: 0, transform: 'translateY(-5px)' }, EO], [5300, { opacity: 1, transform: 'translateY(-5px)' }], [5500, { opacity: 1, transform: 'translateY(-5px)' }, EIO], [5850, { opacity: 1, transform: 'translateY(0px)' }]]);
    // The ring fills once, then drains very slowly: time passing, not an alarm.
    tl('.lk-ring', [[0, { strokeDashoffset: 1 }], [5200, { strokeDashoffset: 1 }, EIO], [5900, { strokeDashoffset: 0 }], [6100, { strokeDashoffset: 0 }], [T, { strokeDashoffset: 0.04 }]]);
    vis('.l1', [[5350, null]], { rise: 4 }); vis('.l2', [[5470, null]], { rise: 4 });
  });

  /* ---------------- E5 Draining time bar ---------------- */
  Kit.register('#e5', (ctx) => {
    const T = 10000;
    const { tl, vis, press } = timeline(ctx, T);
    const q = (o, clip) => ({ opacity: o, clipPath: `inset(0px 0px ${clip}% 0px round 12px)` });
    // Ghost QR while making a code, gone when there is no network, then wiped in top to bottom.
    tl('.qsvg', [[0, q(0.1, 0)], [1300, q(0.1, 0), EI], [1700, q(0, 0)], [4700, q(0, 100), EO], [4720, q(1, 100), EIO], [5700, q(1, 0)]]);
    vis('.qoff', [[1600, 4600]], { rise: 0, d: 300 });
    ctx.$$('.qoff path').forEach((p, i) => tl(p, [[0, { strokeDashoffset: 1 }], [1600 + i * 120, { strokeDashoffset: 1 }, EIO], [2200 + i * 120, { strokeDashoffset: 0 }]]));
    vis('.w0', [[0, 1400]], { rise: 0 });
    vis('.w1', [[1800, 4600]], { rise: 4 });
    vis('.w2', [[5500, null]], { rise: 4 });
    const dot = (f) => ({ backgroundColor: `rgba(255, 210, 204, ${f ? 0.9 : 0})`, borderColor: `rgba(255, 255, 255, ${f ? 0 : 0.35})`, borderColor2: null });
    ctx.$$('.tries i').forEach((d, i) => {
      const t = 6200 + i * 380;
      const a = dot(false), b = dot(true); delete a.borderColor2; delete b.borderColor2;
      tl(d, [[0, a], [t, a, EO], [t + 300, b]]);
    });
    // Code and dots sink away, the lockout text and the draining bar take their place.
    tl('.w2 .code', [[0, { opacity: 1, transform: 'translateY(0px)' }], [8200, { opacity: 1, transform: 'translateY(0px)' }, EI], [8560, { opacity: 0, transform: 'translateY(10px)' }]]);
    tl('.w2 .tries', [[0, { opacity: 1 }], [8200, { opacity: 1 }, EI], [8460, { opacity: 0 }]]);
    vis('.w3', [[8500, null]], { rise: 4 });
    tl('.bar span', [[0, { transform: 'scaleX(1)' }], [8700, { transform: 'scaleX(1)' }], [T, { transform: 'scaleX(0.97)' }]]);
    press('.k0', [4300]);
    vis('.k0', [[1800, 4500]], { rise: 0, d: 300, od: 200, lag: 220 });
    vis('.k1', [[0, 1800], [4500, null]], { rise: 0, d: 300, od: 200, lag: 220 });
  });

  /* ---------------- E6 Quiet radar ---------------- */
  Kit.register('#e6', (ctx) => {
    const T = 8000;
    const { tl, vis, press } = timeline(ctx, T);
    ['.r1', '.r2', '.r3'].forEach((s, k) => {
      const t = 100 + k * 120, c = 6500 - k * 160; // contract: outer first
      tl(s, [[0, { opacity: 0, transform: 'scale(0.86)' }], [t, { opacity: 0, transform: 'scale(0.86)' }, EO], [t + 700, { opacity: 1, transform: 'scale(1)' }],
        [3300, { opacity: 1, transform: 'scale(1)' }, EIO], [3900, { opacity: k ? 0.6 : 1, transform: 'scale(1)' }],
        [c, { opacity: k ? 0.6 : 1, transform: 'scale(1)' }, EIO], [c + 800, { opacity: 0, transform: 'scale(0.42)' }]]);
    });
    tl('.sweep', [[0, { opacity: 0, transform: 'rotate(-30deg)' }], [300, { opacity: 0, transform: 'rotate(-30deg)' }, EO],
      [800, { opacity: 1, transform: 'rotate(40deg)' }, 'cubic-bezier(0.3, 0, 0.4, 1)'], [3000, { opacity: 1, transform: 'rotate(560deg)' }, EO], [3600, { opacity: 0, transform: 'rotate(620deg)' }]]);
    vis('.p1 .t1', [[3400, 6100]]); vis('.p1 .t2', [[3520, 6100]]); vis('.p1 .t3', [[3700, 6100]], { rise: 10 });
    press('.btn > .stk', [5900]);
    tl('.logo', [[0, { opacity: 1 }], [6600, { opacity: 1 }, EO], [7100, { opacity: 0.4 }]]);
    tl('.badge', [[0, { opacity: 0, transform: 'scale(0.7)' }], [6900, { opacity: 0, transform: 'scale(0.7)' }, EO], [7400, { opacity: 1, transform: 'scale(1)' }]]);
    vis('.p2 .t1', [[7000, null]]); vis('.p2 .t2', [[7120, null]]);
  });

  /* ---------------- E7 Signal fades, bridge waits ---------------- */
  Kit.register('#e7', (ctx) => {
    const T = 8400;
    const { tl, vis, press } = timeline(ctx, T);
    const on = { opacity: 1, transform: 'scale(1)' }, off = { opacity: 0, transform: 'scale(0.88)' };
    ['.a3', '.a2', '.a1'].forEach((s, k) => {
      const out = 500 + k * 320, back = 4600 + (2 - k) * 200;
      tl(s, [[0, on], [out, on, EIO], [out + 650, off], [back, off, EO], [back + 550, on]]);
    });
    tl('.logo', [[0, { opacity: 1 }], [1100, { opacity: 1 }, EIO], [1800, { opacity: 0.35 }], [4500, { opacity: 0.35 }, EO], [5000, { opacity: 1 }]]);
    vis('.p1 .t1', [[1500, 4400]]); vis('.p1 .t2', [[1620, 4400]]);
    press('.btn > .stk', [4100]);
    // The dotted bridge reaches for the other device, stops short, and rests faint.
    tl('.mpath', [[0, { strokeDashoffset: 1 }], [5500, { strokeDashoffset: 1 }, 'cubic-bezier(0.25, 0.6, 0.3, 1)'], [6900, { strokeDashoffset: 0.3 }]]);
    tl('.bridge', [[0, { opacity: 1 }], [6900, { opacity: 1 }, EIO], [7600, { opacity: 0.5 }]]);
    tl('.ghost', [[0, { opacity: 0.6 }], [6000, { opacity: 0.6 }, EIO], [6700, { opacity: 0.95 }, EIO], [7500, { opacity: 0.6 }]]);
    vis('.p2 .t1', [[6800, null]]); vis('.p2 .t2', [[6920, null]]); vis('.p2 .t3', [[7040, null]]);
  });

  /* ---------------- E8 Home quietly waits ---------------- */
  Kit.register('#e8', (ctx) => {
    const T = 8200;
    const { tl, vis, press } = timeline(ctx, T);
    const note = ctx.$('.note');
    const H = note.offsetHeight + 16; // the gap the notice opens
    vis('.h0', [[0, 700]], { rise: 0 }); vis('.h1', [[700, null]], { rise: 0, lag: 260 });
    vis('.hdr-sub.s0', [[0, 600]], { rise: 0 }); vis('.hdr-sub.s1', [[600, 4800]], { rise: 0, lag: 260 }); vis('.hdr-sub.s2', [[4800, null]], { rise: 0, lag: 260 });
    // The notice opens a gap and the tiles slide down into place (FLIP: they start where they were).
    tl('.tiles', [[0, { transform: `translateY(${-H}px)` }], [900, { transform: `translateY(${-H}px)` }, EIO], [1500, { transform: 'translateY(0px)' }]]);
    tl(note, [[0, { opacity: 0, transform: 'translateY(-8px)' }], [1050, { opacity: 0, transform: 'translateY(-8px)' }, EO], [1550, { opacity: 1, transform: 'translateY(0px)' }]]);
    ctx.$$('.tile:not(.add)').forEach((t, i) => {
      const d = 1400 + i * 120, pass = 4700 + i * 140;
      tl(t.querySelector('.tg'), [[0, { opacity: 1 }], [d, { opacity: 1 }, EIO], [d + 500, { opacity: 0.4 }], [pass, { opacity: 0.4 }, EIO], [pass + 400, { opacity: 0.75 }, EIO], [pass + 900, { opacity: 0.4 }]]);
      vis(t.querySelector('.ok'), [[0, d]], { rise: 0, od: 200 });
      vis(t.querySelector('.wait'), [[d + 120, null]], { rise: 0, d: 300 });
    });
    vis('.i0', [[0, 4700]], { rise: 0 });
    vis('.i1', [[4700, null]], { rise: 0, d: 200 });
    tl('.shp', [[0, { strokeDashoffset: 1 }], [4750, { strokeDashoffset: 1 }, EIO], [5450, { strokeDashoffset: 0 }]]);
    vis('.n0', [[0, 4650]], { rise: 3 }); vis('.n1', [[4800, null]], { rise: 3, lag: 100 });
    vis('.b0', [[0, 4650]], { rise: 0, d: 200, od: 120 }); vis('.b1', [[4750, null]], { rise: 0, d: 200, lag: 120 });
    press('.note-btn', [4200]);
  });
})();

</script>
</body>
</html>
