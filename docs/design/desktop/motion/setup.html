  .l-ring { fill: none; opacity: 0; }

  /* Enter the code: ring and caret are overlays, so the box never changes size */
  .digit { position: relative; }
  .digit .rg { position: absolute; inset: -1px; border: 2px solid var(--ink); border-radius: var(--r); opacity: 0; }
  .digit .cr { position: absolute; left: 50%; top: 16px; margin-left: -1px; width: 2px; height: 30px; background: var(--ink); opacity: 0; }
  .e-cta { position: relative; width: 100%; }
  .e-go { position: absolute; inset: 0; }
  .e-go .lb2 { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .codewrap { position: relative; }
  .code-wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  /* S1 shared shape */
  .blob { position: absolute; inset: 0; z-index: 5; background: var(--ink); opacity: 0; pointer-events: none; clip-path: inset(50%); }
  /* S3 flowing step pill */
  .steps .trk { position: relative; display: flex; gap: 5px; }
  .steps .trk i { display: block; height: 6px; width: 8px; border-radius: 3px; background: var(--line-2); }
  .steps .trk i.on { background: var(--ink); }
  .steps .trk i.cur { background: var(--ink); width: 22px; }
  .steps .trk .pill { position: absolute; top: 0; left: 39px; width: 22px; height: 6px; border-radius: 3px; background: var(--ink); }
  #s3 .layer, #s3 .w-artin { mask-image: linear-gradient(90deg, #000 0%, #000 33.33%, transparent 66.67%, transparent 100%); mask-size: 300% 100%; mask-repeat: no-repeat; mask-position: 0% 0%; }
  /* S5 odometer digits: 48 px windows with soft top and bottom edges, 36 px in the layout */
  #s5 .w-artin { overflow: hidden; }
  .od-code { display: flex; justify-content: center; letter-spacing: 0; }
  .od { display: block; height: 48px; margin: -6px 0; overflow: hidden; padding: 0 0.04em;
    mask-image: linear-gradient(180deg, transparent 0, #000 12px, #000 36px, transparent 48px); }
  .od-s { display: flex; flex-direction: column; }
  .od-s span { display: block; height: 48px; line-height: 48px; text-align: center; }
  .od-gap { width: 0.3em; }

<script>
/* Setup flow motion options. Every option is one 11 s timeline built from WAAPI tracks.
   Each element and property gets ONE track that spans the whole timeline (fill both),
   so Kit.seek(ms) lands every option on an exact frame. */
(function () {
  'use strict';
  const T = 11000;
  const TM = [2400, 4400, 7000, 9200]; // Welcome > Add > Code > Connecting > Connected
  const OUT = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const IO = 'cubic-bezier(0.65, 0, 0.35, 1)';
  const IN = 'cubic-bezier(0.4, 0, 1, 1)';
  const SOFT = 'cubic-bezier(0.22, 0.8, 0.24, 1)';
  const LIN = 'linear';
  const INK = '#1D1C1A', GREY = '#BDB8B1', GREEN = '#1E7A46';
  const GA = 'linear-gradient(90deg, #000 0%, #000 33.33%, transparent 66.67%, transparent 100%)';
  const GB = 'linear-gradient(90deg, transparent 0%, transparent 33.33%, #000 66.67%, #000 100%)';
  const NEUTRAL = { opacity: 1, transform: 'none', filter: 'blur(0px)' };

  /* ---------- Track helpers ---------- */
  // frames: [[ms, {props}, easingOfSegmentStartingHere]]. Equal times make an instant jump.
  function tk(ctx, el, frames) {
    if (!el) return null;
    if (Array.isArray(el) || el instanceof NodeList) return Array.from(el).map((e) => tk(ctx, e, frames));
    const f = frames.map((x) => x.slice()).sort((a, b) => a[0] - b[0]);
    if (f[0][0] > 0) f.unshift([0, f[0][1]]);
    if (f[f.length - 1][0] < T) f.push([T, f[f.length - 1][1]]);
    const kf = f.map(([t, p, e]) => Object.assign({}, p, { offset: Math.min(1, Math.max(0, t / T)), easing: e || LIN }));
    return ctx.anim(el, kf, { duration: T, easing: LIN, fill: 'both' });
  }
  // One element's whole life: optional entrance (in, id, from, ie) and exit (out, od, to, oe).
  function life(ctx, el, o) {
    if (!el) return null;
    const keys = new Set(['opacity'].concat(Object.keys(o.from || {}), Object.keys(o.to || {})));
    const rest = {};
    keys.forEach((k) => { rest[k] = o.rest && k in o.rest ? o.rest[k] : NEUTRAL[k]; });
    const from = Object.assign({}, rest, { opacity: 0 }, o.from);
    const to = Object.assign({}, rest, { opacity: 0 }, o.to);
    const fr = [];
    if (o.in == null) fr.push([0, rest]);
    else { fr.push([0, from]); fr.push([o.in, from, o.ie || OUT]); fr.push([o.in + (o.id || 500), rest]); }
    if (o.out != null) { fr.push([o.out, rest, o.oe || IN]); fr.push([o.out + (o.od || 300), to]); }
    return tk(ctx, el, fr);
  }
  // Instant opacity switches: pts [[ms, value]].
  function onoff(ctx, el, pts, init) {
    let cur = init || 0;
    const fr = [[0, { opacity: cur }]];
    pts.forEach(([t, v]) => { fr.push([t, { opacity: cur }]); fr.push([t, { opacity: v }]); cur = v; });
    return tk(ctx, el, fr);
  }
  // A short press on a button, ending at t.
  function press(ctx, el, t) {
    tk(ctx, el, [[t - 170, { transform: 'scale(1)' }, IO], [t - 60, { transform: 'scale(0.97)' }, OUT], [t + 220, { transform: 'scale(1)' }]]);
  }
  function draw(ctx, el, t, d, e) {
    tk(ctx, el, [[t, { strokeDashoffset: 1 }, e || IO], [t + d, { strokeDashoffset: 0 }]]);
  }
  function layers(ctx, path) {
    return ['.L-w', '.L-a', path === 'enter' ? '.L-e' : '.L-p', '.L-c', '.L-d'].map((s) => ctx.$(s));
  }
  const q = (L, s) => L.querySelector(s);
  const qa = (L, s) => Array.from(L.querySelectorAll(s));

  /* ---------- Shared pieces ---------- */
  // Kit step dots: the current dot shrinks while the next one grows, so the row never shifts.
  function steps(ctx, ts, dur) {
    dur = dur || 420;
    ctx.$$('.steps > span').forEach((s, i) => {
      const st = (k) => ({ width: (i === k ? 22 : 8) + 'px', backgroundColor: i <= k ? INK : GREY });
      const fr = [[0, st(0)]];
      ts.forEach((t, j) => { fr.push([t, st(j), IO]); fr.push([t + dur, st(j + 1)]); });
      tk(ctx, s, fr);
    });
  }
  // A dot crosses the dashed line from the PC to the Mac, n times.
  function pulse(ctx, C, t0, n, per) {
    const d = q(C, '.l-pulse');
    const tr = [[0, { transform: 'translateX(0px)' }]], op = [[0, { opacity: 0 }]];
    for (let i = 0; i < n; i++) {
      const s = t0 + i * per;
      tr.push([s, { transform: 'translateX(0px)' }, IO]); tr.push([s + per - 120, { transform: 'translateX(80px)' }]);
      tr.push([s + per - 120, { transform: 'translateX(80px)' }]); tr.push([s + per - 119, { transform: 'translateX(0px)' }]);
      op.push([s, { opacity: 0 }, OUT]); op.push([s + 160, { opacity: 1 }]); op.push([s + per - 300, { opacity: 1 }, IN]); op.push([s + per - 140, { opacity: 0 }]);
    }
    tk(ctx, d, tr); tk(ctx, d, op);
  }
  // Connected: the green line draws across, the check circle settles, the tick draws.
  function finale(ctx, D, t) {
    draw(ctx, q(D, '.l-solid'), t + 250, 600);
    tk(ctx, q(D, '.l-check'), [[t + 520, { opacity: 0, transform: 'scale(0.72)' }, OUT], [t + 1120, { opacity: 1, transform: 'scale(1)' }]]);
    draw(ctx, q(D, '.l-tick'), t + 760, 460, OUT);
  }
  // Enter the code: digits arrive one by one, the active box ring and caret move along.
  function typing(ctx, E, t0, style, pressAt) {
    const gap = 240;
    qa(E, '.digit').forEach((d, i) => {
      const tt = t0 + i * gap, prev = i === 0 ? t0 - 420 : t0 + (i - 1) * gap;
      const from = style === 'drop' ? { transform: 'scale(1.35)' } : style === 'rise' ? { transform: 'translateY(9px)' } : {};
      life(ctx, q(d, '.dg'), { in: tt, id: style === 'none' ? 200 : 360, from, ie: OUT });
      const tog = [[prev, { opacity: 0 }, OUT], [prev + 120, { opacity: 1 }], [tt, { opacity: 1 }, OUT], [tt + 120, { opacity: 0 }]];
      tk(ctx, q(d, '.rg'), tog); tk(ctx, q(d, '.cr'), tog);
    });
    const done = t0 + 5 * gap + 160;
    tk(ctx, q(E, '.e-go'), [[done, { opacity: 0 }, OUT], [done + 260, { opacity: 1 }]]);
    if (pressAt) {
      if (!ctx.reduced) press(ctx, q(E, '.e-go'), pressAt);
      tk(ctx, q(E, '.lb1'), [[0, { opacity: 1 }], [pressAt - 20, { opacity: 1 }, OUT], [pressAt + 140, { opacity: 0 }]]);
      tk(ctx, q(E, '.lb2'), [[0, { opacity: 0 }], [pressAt + 40, { opacity: 0 }, OUT], [pressAt + 220, { opacity: 1 }]]);
    }
  }

  /* ---------- Reduced motion: same story, told with fades only ---------- */
  function reducedFlow(ctx, path, tm) {
    tm = tm || TM;
    const Ls = layers(ctx, path);
    const [W, A, X, C, D] = Ls;
    Ls.forEach((L, i) => life(ctx, L, { in: i ? tm[i - 1] + 180 : null, id: 320, ie: 'ease', out: i < 4 ? tm[i] : null, od: 200, oe: 'ease' }));
    ['.w-title', '.w-sub', '.w-cta', '.w-artin'].forEach((s, i) => life(ctx, q(W, s), { in: 80 + i * 140, id: 500, ie: 'ease' }));
    steps(ctx, [tm[0], tm[1], tm[3]], 200);
    if (path === 'enter') typing(ctx, X, tm[1] + 600, 'none', tm[2] - 400);
    const wait = q(X, '.code-wait');
    if (wait) {
      life(ctx, wait, { in: tm[1] + 300, id: 200, out: tm[1] + 1000, od: 200, ie: 'ease', oe: 'ease' });
      life(ctx, q(X, '.code'), { in: tm[1] + 1150, id: 300, ie: 'ease' });
    }
    tk(ctx, q(C, '.l-pulse'), [[0, { opacity: 0 }]]);
    tk(ctx, q(C, '.l-dash'), [[tm[2] + 500, { opacity: 1 }, IO], [tm[2] + 1300, { opacity: 0.35 }, IO], [tm[3] - 100, { opacity: 1 }]]);
    tk(ctx, q(D, '.l-check'), [[tm[3] + 400, { opacity: 0 }, 'ease'], [tm[3] + 800, { opacity: 1 }]]);
  }

  /* ---------- S1 One shape: the black button carries through the flow ---------- */
  Kit.register('#s1', (ctx) => {
    if (ctx.reduced) return reducedFlow(ctx, 'show');
    const [t1, t2, t3, t4] = TM;
    const [W, A, P, C, D] = layers(ctx, 'show');
    const body = ctx.$('.body');
    const b = body.getBoundingClientRect();
    const s = b.width / body.offsetWidth, BW = body.offsetWidth, BH = body.offsetHeight;
    const rect = (el) => { const r = el.getBoundingClientRect(); return { x: (r.left - b.left) / s, y: (r.top - b.top) / s, w: r.width / s, h: r.height / s }; };
    const f = (n) => Math.round(n * 10) / 10;
    const clip = (r, rad, g) => { g = g || 0; return `inset(${f(r.y - g)}px ${f(BW - r.x - r.w - g)}px ${f(BH - r.y - r.h - g)}px ${f(r.x - g)}px round ${f(rad + g)}px)`; };
    const rw = rect(q(W, '.w-btn')), ra = rect(q(A, '.a-show')), rb = rect(q(P, '.codebox')), rn = rect(q(C, '.l-check circle'));
    const cw = clip(rw, 10), ca = clip(ra, 10), cb = clip(rb, 18), cn = clip(rn, rn.w / 2), cn2 = clip(rn, rn.w / 2, 4);
    const blob = ctx.$('.blob');
    tk(ctx, blob, [[0, { clipPath: cw }], [t1 + 150, { clipPath: cw }, IO], [t1 + 850, { clipPath: ca }], [t2 + 150, { clipPath: ca }, IO], [t2 + 950, { clipPath: cb }],
      [t3 + 200, { clipPath: cb }, IO], [t3 + 1000, { clipPath: cn }, IO], [t3 + 1500, { clipPath: cn2 }, IO], [t3 + 2000, { clipPath: cn }]]);
    tk(ctx, blob, [[0, { opacity: 0 }], [t1 + 150, { opacity: 0 }], [t1 + 150, { opacity: 1 }], [t1 + 850, { opacity: 1 }], [t1 + 850, { opacity: 0 }],
      [t2 + 150, { opacity: 0 }], [t2 + 150, { opacity: 1 }], [t2 + 950, { opacity: 1 }], [t2 + 950, { opacity: 0 }],
      [t3 + 200, { opacity: 0 }], [t3 + 200, { opacity: 1 }], [t4 + 260, { opacity: 1 }, OUT], [t4 + 640, { opacity: 0 }]]);
    tk(ctx, blob, [[t4, { backgroundColor: INK }, IO], [t4 + 320, { backgroundColor: GREEN }]]);

    // Welcome
    life(ctx, q(W, '.w-title'), { in: 80, id: 760, from: { transform: 'translateY(14px)' } });
    life(ctx, q(W, '.w-sub'), { in: 200, id: 760, from: { transform: 'translateY(14px)' } });
    life(ctx, q(W, '.w-cta'), { in: 320, id: 760, from: { transform: 'translateY(14px)' } });
    ['.w-laptop', '.w-phone', '.w-droid'].forEach((sel, i) => life(ctx, q(W, sel), { in: 380 + i * 130, id: 900, from: { transform: 'translateY(22px)' } }));
    life(ctx, q(W, '.w-clip'), { in: 900, id: 600, from: { transform: 'translateY(8px) scale(0.9)' } });
    life(ctx, q(W, '.w-arcs'), { in: 1050, id: 700 });
    life(ctx, q(W, '.w-text'), { out: t1, od: 300, to: { transform: 'translateY(-8px)' } });
    life(ctx, q(W, '.w-art'), { out: t1, od: 320 });
    press(ctx, q(W, '.w-btn'), t1);
    life(ctx, q(W, '.w-btn .lbl'), { out: t1, od: 150 });
    onoff(ctx, q(W, '.w-btn'), [[t1 + 150, 0]], 1);
    onoff(ctx, W, [[t1 + 900, 0]], 1);
    // Add
    onoff(ctx, A, [[t1 + 150, 1], [t2 + 1000, 0]]);
    life(ctx, q(A, '.x-art'), { in: t1 + 350, id: 620, from: { transform: 'translateY(12px)' }, out: t2, od: 300 });
    life(ctx, q(A, '.x-text'), { in: t1 + 650, id: 620, from: { transform: 'translateY(12px)' }, out: t2, od: 300 });
    life(ctx, q(A, '.a-enter'), { in: t1 + 600, id: 500, out: t2, od: 250 });
    onoff(ctx, q(A, '.a-show'), [[t1 + 850, 1], [t2 + 150, 0]]);
    life(ctx, q(A, '.a-show .lbl'), { in: t1 + 850, id: 300, out: t2, od: 150 });
    press(ctx, q(A, '.a-show'), t2);
    // Show a code
    onoff(ctx, P, [[t2 + 150, 1], [t3 + 1000, 0]]);
    ['.x-back', '.x-text', '.x-os', '.x-cta'].forEach((sel, i) => life(ctx, q(P, sel), { in: t2 + 420 + i * 60, id: 520, from: { transform: 'translateY(8px)' }, out: t3, od: 300 }));
    onoff(ctx, q(P, '.codebox'), [[t2 + 950, 1], [t3 + 200, 0]]);
    life(ctx, q(P, '.qr'), { in: t2 + 950, id: 520, from: { transform: 'scale(0.96)' }, out: t3, od: 200 });
    life(ctx, q(P, '.codewrap'), { in: t2 + 1080, id: 450, out: t3, od: 200 });
    // Connecting: the shape becomes the link node and breathes
    onoff(ctx, C, [[t3 + 200, 1], [t4 + 700, 0]]);
    life(ctx, q(C, '.x-art'), { in: t3 + 650, id: 600 });
    life(ctx, q(C, '.l-dash'), { out: t4, od: 400 });
    tk(ctx, q(C, '.l-pulse'), [[0, { opacity: 0 }]]);
    life(ctx, q(C, '.x-text'), { in: t3 + 720, id: 520, from: { transform: 'translateY(8px)' }, out: t4, od: 250 });
    life(ctx, q(C, '.x-cta'), { in: t3 + 820, id: 520, out: t4, od: 250 });
    // Connected, in place
    onoff(ctx, D, [[t4, 1]]);
    draw(ctx, q(D, '.l-solid'), t4 + 120, 520);
    tk(ctx, q(D, '.l-check'), [[t4 + 260, { opacity: 0 }, OUT], [t4 + 560, { opacity: 1 }]]);
    draw(ctx, q(D, '.l-tick'), t4 + 420, 420, OUT);
    life(ctx, q(D, '.x-text'), { in: t4 + 360, id: 560, from: { transform: 'translateY(10px)' } });
    life(ctx, q(D, '.x-cta'), { in: t4 + 460, id: 560, from: { transform: 'translateY(10px)' } });
    steps(ctx, [t1, t2, t4]);
  });

  /* ---------- S2 Side by side: horizontal slide, art travels further (parallax) ---------- */
  Kit.register('#s2', (ctx) => {
    if (ctx.reduced) return reducedFlow(ctx, 'enter');
    const Ls = layers(ctx, 'enter');
    const [W, A, E, C, D] = Ls;
    Ls.forEach((L, i) => {
      const tin = i ? TM[i - 1] : null, tout = i < 4 ? TM[i] : null;
      const pts = []; if (tin != null) pts.push([tin, 1]); if (tout != null) pts.push([tout + 420, 0]);
      onoff(ctx, L, pts, i === 0 ? 1 : 0);
      qa(L, '[data-p]').forEach((el) => {
        const p = Number(el.dataset.p);
        life(ctx, el, {
          in: tin == null ? null : tin + 290 + (p > 1.5 ? 0 : 40), id: 720, ie: OUT, from: { transform: `translateX(${Math.round(84 * p)}px)` },
          out: tout, od: 300, oe: IN, to: { transform: `translateX(${Math.round(-52 * p)}px)` },
        });
      });
    });
    // Welcome: devices arrive from the right at three speeds
    life(ctx, q(W, '.w-title'), { in: 120, id: 800, from: { transform: 'translateX(28px)' } });
    life(ctx, q(W, '.w-sub'), { in: 240, id: 800, from: { transform: 'translateX(28px)' } });
    life(ctx, q(W, '.w-cta'), { in: 360, id: 800, from: { transform: 'translateX(28px)' } });
    [['.w-laptop', 60], ['.w-phone', 110], ['.w-droid', 160]].forEach(([sel, dx], i) => life(ctx, q(W, sel), { in: 300 + i * 80, id: 1000, from: { transform: `translateX(${dx}px)` } }));
    life(ctx, q(W, '.w-clip'), { in: 900, id: 600, from: { transform: 'translateX(40px)' } });
    life(ctx, q(W, '.w-arcs'), { in: 1100, id: 700 });
    press(ctx, q(W, '.w-btn'), TM[0]);
    press(ctx, q(A, '.a-enter'), TM[1]);
    typing(ctx, E, TM[1] + 640, 'rise', TM[2] - 400);
    pulse(ctx, C, TM[2] + 700, 2, 760);
    finale(ctx, D, TM[3] + 200);
    steps(ctx, [TM[0], TM[1], TM[3]]);
  });

  /* ---------- S3 Ink flow: the step pill stretches and pulls a soft wipe ---------- */
  Kit.register('#s3', (ctx) => {
    if (ctx.reduced) return reducedFlow(ctx, 'show');
    const Ls = layers(ctx, 'show');
    const [W, A, P, C, D] = Ls;
    const vis = (img, pos, op) => ({ maskImage: img, maskPosition: pos, opacity: op });
    Ls.forEach((L, i) => {
      const tin = i ? TM[i - 1] + 330 : null, tout = i < 4 ? TM[i] + 80 : null;
      const fr = [];
      if (tin == null) fr.push([0, vis(GA, '0% 0%', 1)]);
      else { fr.push([0, vis(GA, '100% 0%', 0)]); fr.push([tin, vis(GA, '100% 0%', 0)]); fr.push([tin, vis(GA, '100% 0%', 1), IO]); fr.push([tin + 760, vis(GA, '0% 0%', 1)]); }
      if (tout != null) { fr.push([tout, vis(GA, '0% 0%', 1)]); fr.push([tout, vis(GB, '100% 0%', 1), IO]); fr.push([tout + 600, vis(GB, '0% 0%', 1)]); fr.push([tout + 600, vis(GB, '0% 0%', 0)]); }
      tk(ctx, L, fr);
    });
    // Step pill: the right edge runs ahead to the next dot, then the left edge follows.
    const dots = ctx.$$('.trk i'), pill = ctx.$('.trk .pill');
    const ts = [TM[0], TM[1], TM[3]];
    dots.forEach((d, i) => {
      const st = (k) => ({ width: (i === k ? 22 : 8) + 'px' });
      const fr = [[0, st(0)]];
      ts.forEach((t, j) => { fr.push([t + 120, st(j), IO]); fr.push([t + 480, st(j + 1)]); });
      tk(ctx, d, fr);
      const cf = [[0, { backgroundColor: i === 0 ? INK : GREY }]];
      if (i > 0) { const t = ts[i - 1] + 260; cf.push([t, { backgroundColor: GREY }]); cf.push([t, { backgroundColor: INK }]); }
      tk(ctx, d, cf);
    });
    const pf = [[0, { left: '0px', width: '22px' }]];
    ts.forEach((t, k) => {
      pf.push([t, { left: k * 13 + 'px', width: '22px' }, OUT]);
      pf.push([t + 420, { left: k * 13 + 'px', width: '35px' }, IO]);
      pf.push([t + 520, { left: k * 13 + 'px', width: '35px' }, IO]);
      pf.push([t + 980, { left: (k + 1) * 13 + 'px', width: '22px' }]);
    });
    tk(ctx, pill, pf);
    // Welcome: the art is wiped in from the left, the text settles.
    tk(ctx, q(W, '.w-artin'), [[250, { maskPosition: '100% 0%' }, SOFT], [1500, { maskPosition: '0% 0%' }]]);
    ['.w-title', '.w-sub', '.w-cta'].forEach((sel, i) => life(ctx, q(W, sel), { in: 60 + i * 120, id: 700, from: { transform: 'translateY(6px)' } }));
    press(ctx, q(W, '.w-btn'), TM[0]);
    press(ctx, q(A, '.a-show'), TM[1]);
    pulse(ctx, C, TM[2] + 900, 2, 760);
    finale(ctx, D, TM[3] + 600);
  });

  /* ---------- S4 Drawn by hand: lines draw themselves, the QR fills in ---------- */
  Kit.register('#s4', (ctx) => {
    if (ctx.reduced) return reducedFlow(ctx, 'show');
    const [t1, t2, t3, t4] = TM;
    const [W, A, P, C, D] = layers(ctx, 'show');
    life(ctx, A, { in: t1 + 240, id: 400, ie: 'ease', out: t2, od: 300 });
    life(ctx, P, { in: t2 + 240, id: 400, ie: 'ease', out: t3, od: 300 });
    life(ctx, W, { out: t1, od: 300 });
    life(ctx, C, { in: t3 + 240, id: 400, ie: 'ease', out: t4 + 800, od: 1 });
    onoff(ctx, D, [[t4, 1]]);
    // [data-d] strokes draw, [data-f] parts fade, relative to their screen's start.
    [[W, 0], [A, t1 + 240], [C, t3 + 240]].forEach(([L, t0]) => {
      qa(L, '[data-d]').forEach((el) => {
        const [a, d] = el.dataset.d.split(',').map(Number);
        draw(ctx, el, t0 + a, d, SOFT);
        // white fills arrive once the outline is mostly drawn, so no blank shapes show early
        if (el.tagName === 'rect' || el.tagName === 'circle') tk(ctx, el, [[t0 + a + d * 0.55, { fillOpacity: 0 }, 'ease'], [t0 + a + d, { fillOpacity: 1 }]]);
      });
      qa(L, '[data-f]').forEach((el) => { const [a, d] = el.dataset.f.split(',').map(Number); tk(ctx, el, [[t0 + a, { opacity: 0 }, 'ease'], [t0 + a + d, { opacity: 1 }]]); });
    });
    ['.w-title', '.w-sub', '.w-cta'].forEach((sel, i) => life(ctx, q(W, sel), { in: 100 + i * 160, id: 600, ie: 'ease' }));
    // QR: corner marks draw, then modules fill in diagonal bands from the top left.
    const q0 = t2 + 420;
    qa(P, '.qf').forEach((el) => draw(ctx, el, q0, 640, SOFT));
    qa(P, '.qc').forEach((el) => tk(ctx, el, [[q0 + 420, { opacity: 0, transform: 'scale(0.4)' }, OUT], [q0 + 820, { opacity: 1, transform: 'scale(1)' }]]));
    qa(P, '.qb').forEach((el) => { const k = Number(el.dataset.b); tk(ctx, el, [[q0 + 380 + k * 34, { opacity: 0 }, 'ease'], [q0 + 380 + k * 34 + 300, { opacity: 1 }]]); });
    life(ctx, q(P, '.codewrap'), { in: q0 + 1250, id: 500, ie: 'ease' });
    press(ctx, q(W, '.w-btn'), t1);
    press(ctx, q(A, '.a-show'), t2);
    pulse(ctx, C, t3 + 1100, 2, 700);
    // Connected, in place: the old text goes, the line turns solid.
    life(ctx, q(C, '.x-text'), { out: t4, od: 260 });
    life(ctx, q(C, '.x-cta'), { out: t4, od: 260 });
    life(ctx, q(C, '.l-dash'), { out: t4 + 150, od: 450 });
    life(ctx, q(D, '.x-text'), { in: t4 + 260, id: 520, ie: 'ease' });
    life(ctx, q(D, '.x-cta'), { in: t4 + 360, id: 520, ie: 'ease' });
    finale(ctx, D, t4 - 100);
    steps(ctx, [t1, t2, t4]);
  });

  /* ---------- S5 Odometer: screens roll up, the code digits spin and land ---------- */
  const TM5 = [2400, 4400, 7400, 9400];
  Kit.register('#s5', (ctx) => {
    if (ctx.reduced) return reducedFlow(ctx, 'show', TM5);
    const [t1, t2, t3, t4] = TM5;
    const Ls = layers(ctx, 'show');
    const [W, A, P, C, D] = Ls;
    Ls.forEach((L, i) => life(ctx, L, {
      in: i ? TM5[i - 1] + 330 : null, id: 660, ie: OUT, from: { transform: 'translateY(48px)' },
      out: i < 4 ? TM5[i] : null, od: 300, oe: IN, to: { transform: 'translateY(-36px)' },
    }));
    // Welcome: devices roll up into the window like reels landing.
    [['.w-laptop', 150], ['.w-phone', 150], ['.w-droid', 150]].forEach(([sel, dy], i) => life(ctx, q(W, sel), { in: 260 + i * 150, id: 1000, ie: SOFT, from: { transform: `translateY(${dy}px)`, opacity: 1 } }));
    life(ctx, q(W, '.w-clip'), { in: 980, id: 700, from: { transform: 'translateY(40px)' } });
    life(ctx, q(W, '.w-arcs'), { in: 1150, id: 600 });
    ['.w-title', '.w-sub', '.w-cta'].forEach((sel, i) => life(ctx, q(W, sel), { in: 60 + i * 110, id: 700, from: { transform: 'translateY(18px)' } }));
    // Code: "Making a code..." then each digit column spins down and lands, left to right.
    life(ctx, q(P, '.code-wait'), { in: t2 + 330, id: 300, out: t2 + 700, od: 200 });
    qa(P, '.od-s').forEach((el, i) => {
      const n = el.children.length;
      const s = t2 + 860 + i * 90, d = 760 + i * 90;
      tk(ctx, el, [[s, { transform: `translateY(${-(n - 1) * 48}px)` }, 'cubic-bezier(0.3, 0.6, 0.2, 1)'], [s + d, { transform: 'translateY(0px)' }]]);
      life(ctx, el.parentElement, { in: s, id: 260 });
    });
    press(ctx, q(W, '.w-btn'), t1);
    press(ctx, q(A, '.a-show'), t2);
    pulse(ctx, C, t3 + 800, 2, 760);
    finale(ctx, D, t4 + 150);
    steps(ctx, [t1, t2, t4]);
  });

  /* ---------- S6 Depth: the old screen sinks back, the next settles forward ---------- */
  Kit.register('#s6', (ctx) => {
    if (ctx.reduced) return reducedFlow(ctx, 'enter');
    const Ls = layers(ctx, 'enter');
    const [W, A, E, C, D] = Ls;
    Ls.forEach((L, i) => life(ctx, L, {
      in: i ? TM[i - 1] + 300 : null, id: 700, ie: OUT, from: { transform: 'scale(1.045)', filter: 'blur(4px)' },
      out: i < 4 ? TM[i] : null, od: 420, oe: IO, to: { transform: 'scale(0.93)', filter: 'blur(3px)' },
    }));
    // Welcome: the scene pulls into focus, near things first.
    ['.w-title', '.w-sub', '.w-cta'].forEach((sel, i) => life(ctx, q(W, sel), { in: 80 + i * 140, id: 800, from: { filter: 'blur(6px)' } }));
    [['.w-laptop', 0.9], ['.w-phone', 0.86], ['.w-droid', 0.82]].forEach(([sel, sc], i) => life(ctx, q(W, sel), { in: 300 + i * 150, id: 900, from: { transform: `scale(${sc})`, filter: 'blur(4px)' } }));
    life(ctx, q(W, '.w-clip'), { in: 950, id: 700, from: { transform: 'scale(1.3)', filter: 'blur(3px)' } });
    life(ctx, q(W, '.w-arcs'), { in: 1150, id: 700 });
    press(ctx, q(W, '.w-btn'), TM[0]);
    press(ctx, q(A, '.a-enter'), TM[1]);
    typing(ctx, E, TM[1] + 700, 'drop', TM[2] - 400);
    pulse(ctx, C, TM[2] + 800, 2, 760);
    finale(ctx, D, TM[3] + 200);
    steps(ctx, [TM[0], TM[1], TM[3]]);
  });

  /* ---------- S7 Pulse: the two devices call and answer, then the line turns green ---------- */
  const TM7 = [2400, 4400, 6600, 9300];
  Kit.register('#s7', (ctx) => {
    if (ctx.reduced) return reducedFlow(ctx, 'show', TM7);
    const [t1, t2, t3, t4] = TM7;
    const [W, A, P, C, D] = layers(ctx, 'show');
    life(ctx, W, { out: t1, od: 300 });
    life(ctx, A, { in: t1 + 300, id: 560, from: { transform: 'translateY(10px)' }, out: t2, od: 300 });
    life(ctx, P, { in: t2 + 300, id: 560, from: { transform: 'translateY(10px)' }, out: t3, od: 300 });
    life(ctx, C, { in: t3 + 300, id: 560, from: { transform: 'translateY(10px)' }, out: t4 + 800, od: 1 });
    onoff(ctx, D, [[t4, 1]]);
    // Welcome: one dot traces the arcs from the laptop to the phone to the Android.
    ['.w-title', '.w-sub', '.w-cta'].forEach((sel, i) => life(ctx, q(W, sel), { in: 60 + i * 120, id: 700, from: { transform: 'translateY(8px)' } }));
    ['.w-laptop', '.w-phone', '.w-droid', '.w-clip'].forEach((sel, i) => life(ctx, q(W, sel), { in: 200 + i * 110, id: 600, ie: 'ease' }));
    const dot = q(W, '.w-dot');
    const legs = [[q(W, '.w-arc1'), 650, 1350], [q(W, '.w-arc2'), 1480, 2050]];
    const tr = [];
    const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
    legs.forEach(([p, a, z], li) => {
      const len = p.getTotalLength();
      for (let k = 0; k <= 24; k++) {
        const pt = p.getPointAtLength(len * ease(k / 24));
        tr.push([a + (z - a) * k / 24, { transform: `translate(${pt.x.toFixed(2)}px, ${pt.y.toFixed(2)}px)` }]);
      }
      draw(ctx, q(W, '.mk' + (li + 1)), a, z - a, IO);
      tk(ctx, q(W, '.w-e' + (li + 1)), [[z - 60, { opacity: 0, transform: 'scale(0.4)' }, OUT], [z + 260, { opacity: 1, transform: 'scale(1)' }]]);
    });
    tk(ctx, dot, tr);
    tk(ctx, dot, [[0, { opacity: 0 }], [600, { opacity: 0 }, OUT], [760, { opacity: 1 }], [2000, { opacity: 1 }, 'ease'], [2250, { opacity: 0 }]]);
    tk(ctx, q(P, '.qr'), [[t2 + 300, { transform: 'scale(0.97)' }, OUT], [t2 + 900, { transform: 'scale(1)' }]]);
    press(ctx, q(W, '.w-btn'), t1);
    press(ctx, q(A, '.a-show'), t2);
    // Connecting: PC calls, the Mac answers with a ring, then the Mac calls back.
    const pd = q(C, '.l-pulse');
    tk(ctx, pd, [[0, { transform: 'translateX(0px)' }], [7150, { transform: 'translateX(0px)' }, IO], [7950, { transform: 'translateX(80px)' }],
      [8150, { transform: 'translateX(80px)' }, IO], [8950, { transform: 'translateX(0px)' }]]);
    tk(ctx, pd, [[0, { opacity: 0 }], [7150, { opacity: 0 }, OUT], [7300, { opacity: 1 }], [7850, { opacity: 1 }, IN], [7980, { opacity: 0 }],
      [8150, { opacity: 0 }, OUT], [8300, { opacity: 1 }], [8850, { opacity: 1 }, IN], [8980, { opacity: 0 }]]);
    const ring = (el, t) => tk(ctx, el, [[t, { opacity: 0, transform: 'scale(0.97)' }, OUT], [t + 180, { opacity: 0.9, transform: 'scale(1)' }, 'ease-out'], [t + 900, { opacity: 0, transform: 'scale(1.07)' }]]);
    ring(q(C, '.l-ring-mac'), 7880); ring(q(C, '.l-ring-pc'), 8880);
    tk(ctx, q(C, '.l-dash'), [[7150, { opacity: 1 }, IO], [8000, { opacity: 0.55 }, IO], [8900, { opacity: 1 }], [t4 + 100, { opacity: 1 }, IO], [t4 + 500, { opacity: 0 }]]);
    life(ctx, q(C, '.x-text'), { out: t4, od: 260 });
    life(ctx, q(C, '.x-cta'), { out: t4, od: 260 });
    life(ctx, q(D, '.x-text'), { in: t4 + 260, id: 560, from: { transform: 'translateY(8px)' } });
    life(ctx, q(D, '.x-cta'), { in: t4 + 360, id: 560, from: { transform: 'translateY(8px)' } });
    finale(ctx, D, t4 - 100);
    steps(ctx, [t1, t2, t4]);
  });
})();

</script>
</body>
</html>
