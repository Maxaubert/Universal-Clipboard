<style>
  /* Page-local styles for activity.html. Resting styles show the final, readable state. */
  .home { position: relative; }
  .home .tile { position: relative; }
  .tile .lg { color: var(--ink); }

  /* Twin text: .a is the earlier text, .b the later one. Rest shows .b. */
  .swap { display: inline-grid; overflow: hidden; padding: 2px 0; margin: -2px 0; }
  .swap > * { grid-area: 1 / 1; }
  .swap > .a { opacity: 0; }
  .tile-state .st2 { display: inline-grid; justify-items: center; }
  .stw { justify-items: center; }

  /* A1 Relay */
  .badge {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--green); display: flex; align-items: center; justify-content: center; opacity: 0;
  }
  .pkt {
    position: absolute; left: 0; top: 0; z-index: 4; width: 18px; height: 22px; box-sizing: border-box;
    border-radius: 4px; background: var(--ink); opacity: 0; pointer-events: none; offset-rotate: 0deg;
    box-shadow: 0 2px 6px rgba(40, 35, 30, 0.18);
  }
  .pkt::before, .pkt::after {
    content: ''; position: absolute; left: 4px; right: 4px; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.85);
  }
  .pkt::before { top: 7px; }
  .pkt::after { top: 12px; right: 7px; }
  .foot {
    margin-top: auto; border-top: 1px solid var(--line); padding: 14px 2px 0; display: flex; align-items: center; gap: 10px;
    font-size: 14px; line-height: 20px;
  }
  .foot-ico { color: var(--ink-3); width: 20px; height: 20px; }
  .foot-t { flex: 1; min-width: 0; font-weight: 600; color: var(--ink); }
  .foot-time { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .foot-time .swap { justify-items: end; }

  /* A2 Arrival */
  .halo { position: absolute; inset: -1px; border-radius: var(--r-tile); border: 2px solid var(--green); opacity: 0; pointer-events: none; }
  .note {
    display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--line);
    border-radius: var(--r-tile); padding: 12px 16px 12px 12px;
    box-shadow: 0 1px 2px rgba(40,35,30,0.04), 0 6px 16px rgba(40,35,30,0.06);
  }
  .note-ico {
    width: 40px; height: 40px; flex: none; box-sizing: border-box; border-radius: var(--r); background: var(--paper);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink-2);
  }
  .note-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .note-t { font-size: 14.5px; line-height: 20px; font-weight: 600; }
  .note-time { font-size: 13px; line-height: 18px; color: var(--ink-3); }
  .note-arrow { color: var(--green); display: flex; }

  /* A3 Ticker */
  .tk { display: inline-grid; overflow: hidden; padding: 2px 0; margin: -2px 0; }
  .tk-i { grid-area: 1 / 1; white-space: nowrap; }
  .tk-i.t1, .tk-i.t2 { opacity: 0; }
  .tk-ico { position: relative; width: 15px; height: 15px; flex: none; display: inline-flex; align-items: center; justify-content: center; margin: 0 -3px 0 -3px; }
  .tk-ico svg { position: absolute; inset: 0; opacity: 0; color: var(--ink); }
  .tk-ico .tk-in { color: var(--green); }

  /* A4 Hush, A5 Shade: header twins */
  .hw { line-height: inherit; }
  .hdr-sub .swap { white-space: nowrap; }

  /* A5 Shade */
  .shadewrap { position: relative; }
  .shade-clip { position: absolute; inset: -6px; z-index: 2; border-radius: 16px; overflow: hidden; pointer-events: none; }
  .shade {
    position: absolute; inset: 0; border-radius: 16px;
    background: rgba(247, 246, 244, 0.9); -webkit-backdrop-filter: grayscale(1); backdrop-filter: grayscale(1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px var(--line), 0 1px 0 var(--line-2), 0 10px 20px rgba(40, 35, 30, 0.10);
    transform: translateY(-112%);
  }
  .shade-in { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .shade-ico {
    width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--ink); box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; margin-bottom: 6px; color: var(--ink);
  }
  .shade-t { font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .shade .btn { margin-top: 12px; }

  /* A6 Flag */
  .banner {
    display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--line);
    border-radius: var(--r-tile); padding: 12px 12px 12px 14px;
  }
  .bn-ico { position: relative; width: 34px; height: 34px; flex: none; }
  .bn-ico svg { display: block; }
  .bn-ring { transform: rotate(-90deg); transform-origin: center; transform-box: fill-box; stroke-dasharray: 94.25; stroke-dashoffset: 0; }
  .bn-pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--red); box-sizing: border-box; opacity: 0; }
  .bn-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .bn-t { font-size: 14.5px; line-height: 20px; font-weight: 600; }
  .bn-s { font-size: 13.5px; line-height: 18px; color: var(--ink-3); }
  .ubdot { background: var(--red); }

  /* A7 Breathe and renew */
  .cb7 { gap: 18px; }
  .qrwrap { position: relative; width: 256px; height: 256px; flex: none; }
  .qrwrap .qr { position: absolute; inset: 0; }
  .breath { position: absolute; left: -10px; top: -10px; opacity: 0.3; pointer-events: none; transform-origin: center; }
  #a7.is-playing .breath { animation: uc-breathe 5500ms var(--ease-in-out) infinite; }
  @keyframes uc-breathe { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.62; transform: scale(1.014); } }
  html.reduce #a7 .breath { animation: none; opacity: 0.4; }
  .wipe-edge {
    position: absolute; left: 0; right: 0; top: 0; height: 2px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(29,28,26,0), rgba(29,28,26,0.55) 30%, rgba(29,28,26,0.55) 70%, rgba(29,28,26,0));
  }
  .cb7 .code { white-space: nowrap; }
  .dg { display: inline-grid; overflow: hidden; vertical-align: top; padding: 4px 0; margin: -4px 0; }
  .dg > * { grid-area: 1 / 1; }
  .dg-o { opacity: 0; }
  .dg-gap { display: inline-block; width: 0.3em; }
  .timer { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: -4px; }
  .bar { display: block; width: 160px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.16); overflow: hidden; opacity: 0; }
  .bar-fill { display: block; height: 100%; background: var(--white); transform-origin: left center; }
  .timer-t { font-size: 13.5px; line-height: 18px; color: var(--line-2); font-variant-numeric: tabular-nums; }

<script>
/* Sync activity options. Every element gets one WAAPI track per property group that spans the whole
   loop, so seek and replay always land on the right frame. Resting HTML is the last frame. */
(function () {
  const EO = 'cubic-bezier(0.16, 1, 0.3, 1)';
  const EIO = 'cubic-bezier(0.65, 0, 0.35, 1)';
  const EI = 'cubic-bezier(0.4, 0, 1, 1)';

  // Timeline builder: at(t, pose) sets a pose, to(t0, t1, pose, easing) moves to a pose between t0 and t1.
  function T(total) {
    const stops = []; let last = null;
    const api = {
      at(t, v) { stops.push([t, v, 'linear']); last = v; return api; },
      to(t0, t1, v, e) { stops.push([t0, last, e || EIO]); stops.push([t1, v, 'linear']); last = v; return api; },
      play(ctx, el) {
        const kf = stops.map(([t, v, e]) => Object.assign({ offset: Math.min(1, t / total), easing: e }, v));
        if (kf[0].offset > 0) kf.unshift(Object.assign({}, stops[0][1], { offset: 0 }));
        if (kf[kf.length - 1].offset < 1) kf.push(Object.assign({}, last, { offset: 1 }));
        return ctx.anim(el, kf, { duration: total, easing: 'linear', fill: 'both' });
      },
    };
    return api;
  }
  const loopOf = (ctx) => Number(ctx.opt.dataset.loop);

  // Show one of several stacked elements at a time. seq: [[t, index], ...]. Rolls up, or pops in place.
  function cycle(ctx, els, start, seq, opt) {
    opt = opt || {};
    const total = loopOf(ctx), dur = opt.dur || 460;
    const dist = ctx.reduced ? 0 : (opt.dist == null ? 110 : opt.dist);
    const pop = opt.mode === 'pop';
    const pose = (vis, dir) => pop
      ? { opacity: vis ? 1 : 0, transform: `scale(${vis || ctx.reduced ? 1 : 0.6})` }
      : { opacity: vis ? 1 : 0, transform: `translateY(${vis ? 0 : dir * dist}%)` };
    els.forEach((el, i) => {
      let vis = i === start;
      const tr = T(total).at(0, pose(vis, 1));
      seq.forEach(([t, idx]) => {
        // The old text leaves first; the new one starts a little later, so the two barely overlap.
        if (vis && idx !== i) { tr.to(t, t + Math.round(dur * 0.55), pose(false, -1), EI); vis = false; }
        else if (!vis && idx === i) {
          const d0 = Math.round(dur * (ctx.reduced ? 0.6 : 0.3)); // reduced: no roll to hide the swap, so wait for the old text to go
          tr.to(t + d0, t + d0, pose(false, 1)); tr.to(t + d0, t + d0 + dur, pose(true, 0), EO); vis = true;
        }
      });
      tr.play(ctx, el);
    });
  }
  const twin = (ctx, sw, seq, opt) => cycle(ctx, [sw.querySelector('.a'), sw.querySelector('.b')], 0, seq, opt);

  /* ---------- A1 Relay ---------- */
  Kit.register('#a1', (ctx) => {
    const total = loopOf(ctx);
    const hdr = ctx.$('.hdr');
    const ox = hdr.offsetLeft + hdr.offsetWidth / 2, oy = hdr.offsetTop + hdr.offsetHeight + 4;
    const names = ['Mac mini', 'Ubuntu laptop', 'iPhone', 'Pixel 8'];
    names.forEach((n, i) => {
      const t = ctx.$(`.tile[data-device="${n}"]`);
      const b = t.querySelector('.badge');
      const p = ctx.$('.p' + i);
      const s = 1000 + i * 140;
      if (ctx.reduced) {
        T(total).at(0, { opacity: 0 }).to(900, 1300, { opacity: 1 }, EO).to(4700, 5100, { opacity: 0 }, EIO).play(ctx, b);
        return;
      }
      const dx = t.offsetLeft + t.offsetWidth - 18, dy = t.offsetTop + 18;
      const lift = Math.max(40, (dy - oy) * 0.35);
      p.style.offsetPath = `path('M ${ox} ${oy} C ${ox} ${oy + lift}, ${dx} ${dy - lift - 30}, ${dx} ${dy}')`;
      const A0 = { opacity: 0, transform: 'scale(0.7)', offsetDistance: '0%' };
      T(total).at(0, A0)
        .to(350, 750, { opacity: 1, transform: 'scale(1)', offsetDistance: '0%' }, EO)
        .to(s, s + 1050, { opacity: 1, transform: 'scale(1)', offsetDistance: '100%' }, EIO)
        .to(s + 1050, s + 1300, { opacity: 0, transform: 'scale(0.5)', offsetDistance: '100%' }, EI)
        .play(ctx, p);
      T(total).at(0, { opacity: 0, transform: 'scale(0.5)' })
        .to(s + 950, s + 1400, { opacity: 1, transform: 'scale(1)' }, EO)
        .to(4700, 5100, { opacity: 0, transform: 'scale(0.85)' }, EIO)
        .play(ctx, b);
    });
    ctx.$$('.foot .ft').forEach((sw) => twin(ctx, sw, [[2500, 1]]));
  });

  /* ---------- A2 Arrival ---------- */
  Kit.register('#a2', (ctx) => {
    const total = loopOf(ctx), R = ctx.reduced;
    const mac = ctx.$('.tile[data-device="Mac mini"]');
    T(total).at(0, { opacity: 0, transform: 'scale(1)' })
      .to(300, 700, { opacity: 1, transform: 'scale(1)' }, EO)
      .to(900, 2400, { opacity: 0, transform: R ? 'scale(1)' : 'scale(1.07)' }, EO)
      .play(ctx, mac.querySelector('.halo'));
    if (!R) {
      T(total).at(0, { transform: 'translateY(0)' })
        .to(300, 800, { transform: 'translateY(-4px)' }, EO)
        .to(800, 1600, { transform: 'translateY(0)' }, EIO)
        .play(ctx, mac.querySelector('.lg'));
    }
    const note = ctx.$('.note');
    T(total).at(0, { opacity: 0, transform: R ? 'none' : 'translateY(16px)', clipPath: R ? 'inset(0 round 12px)' : 'inset(100% 0 0 0 round 12px)' })
      .to(900, 1600, { opacity: 1, transform: 'none', clipPath: 'inset(0 round 12px)' }, EO)
      .play(ctx, note);
    T(total).at(0, { opacity: 0, transform: R ? 'none' : 'translateY(6px)' })
      .to(1150, 1650, { opacity: 1, transform: 'none' }, EO)
      .play(ctx, [note.querySelector('.note-ico'), note.querySelector('.note-text')]);
    T(total).at(0, { opacity: 0, transform: R ? 'none' : 'translate(4px, -4px)' })
      .to(1350, 1850, { opacity: 1, transform: 'none' }, EO)
      .play(ctx, note.querySelector('.note-arrow'));
    twin(ctx, ctx.$('.nt'), [[4800, 1]]);
  });

  /* ---------- A3 Ticker ---------- */
  Kit.register('#a3', (ctx) => {
    const seq = [[900, 1], [3700, 0], [5400, 2], [8200, 0]];
    cycle(ctx, ctx.$$('.tk-i'), 0, seq, { dur: 520 });
    cycle(ctx, [ctx.$('.tk-dot'), ctx.$('.tk-out'), ctx.$('.tk-in')], 0, seq, { mode: 'pop', dur: 420 });
    const ip = ctx.$('.tile[data-device="iPhone"]');
    T(loopOf(ctx)).at(0, { borderColor: '#D9D6D1' })
      .to(5500, 6000, { borderColor: 'rgba(30, 122, 70, 0.6)' }, EO)
      .to(7400, 8200, { borderColor: '#D9D6D1' }, EIO)
      .play(ctx, ip);
  });

  /* ---------- shared: pause button, header, wave ---------- */
  function pauseButton(ctx, onT, offT, pressOff) {
    const total = loopOf(ctx), btn = ctx.$('.hdr .pz');
    const W = { backgroundColor: '#FFFFFF', color: '#1D1C1A', borderColor: '#BDB8B1' };
    const K = { backgroundColor: '#1D1C1A', color: '#FFFFFF', borderColor: '#1D1C1A' };
    T(total).at(0, W).to(onT + 60, onT + 340, K, EO).to(offT + 60, offT + 340, W, EO).play(ctx, btn);
    if (ctx.reduced) return;
    const tr = T(total).at(0, { transform: 'scale(1)' })
      .to(onT, onT + 120, { transform: 'scale(0.92)' }, EO).to(onT + 120, onT + 420, { transform: 'scale(1)' }, EO);
    if (pressOff) tr.to(offT, offT + 120, { transform: 'scale(0.92)' }, EO).to(offT + 120, offT + 420, { transform: 'scale(1)' }, EO);
    tr.play(ctx, btn);
  }
  function pauseHeader(ctx, onT, offT) {
    const seq = [[onT, 0], [offT, 1]];
    cycle(ctx, [ctx.$('.hw .a'), ctx.$('.hw .b')], 1, seq, { dur: 520 });
    cycle(ctx, [ctx.$('.hs .a'), ctx.$('.hs .b')], 1, seq, { dur: 520 });
    const G = { backgroundColor: '#1E7A46', boxShadow: 'inset 0 0 0 1.5px rgba(110, 106, 100, 0)' };
    const P = { backgroundColor: 'rgba(30, 122, 70, 0)', boxShadow: 'inset 0 0 0 1.5px rgba(110, 106, 100, 1)' };
    T(loopOf(ctx)).at(0, G).to(onT, onT + 500, P, EIO).to(offT, offT + 500, G, EIO).play(ctx, ctx.$('.hdot'));
  }

  /* ---------- A4 Hush ---------- */
  Kit.register('#a4', (ctx) => {
    const total = loopOf(ctx), R = ctx.reduced;
    const ON = 700, OFF = 5600;
    pauseButton(ctx, ON, OFF, true);
    pauseHeader(ctx, ON + 200, OFF + 200);
    const btn = ctx.$('.hdr .pz');
    const bx = btn.offsetLeft + btn.offsetWidth / 2, by = btn.offsetTop + btn.offsetHeight / 2;
    const all = ctx.$$('.tile');
    const dist = all.map((t) => Math.hypot(t.offsetLeft + t.offsetWidth / 2 - bx, t.offsetTop + t.offsetHeight / 2 - by));
    const dmin = Math.min(...dist);
    const D = R ? 400 : 620;
    all.forEach((t, i) => {
      const lag = R ? 0 : Math.round((dist[i] - dmin) * 1.25);
      const p = ON + 350 + lag, r = OFF + 350 + lag;
      if (t.classList.contains('add')) {
        T(total).at(0, { borderColor: '#8A857E', color: '#1D1C1A' })
          .to(p, p + D, { borderColor: '#B3AEA7', color: '#6E6A64' }, EIO)
          .to(r, r + D, { borderColor: '#8A857E', color: '#1D1C1A' }, EIO).play(ctx, t);
        return;
      }
      const C = (a, b) => T(total).at(0, a).to(p, p + D, b, EIO).to(r, r + D, a, EIO);
      C({ color: '#1D1C1A' }, { color: '#B3AEA7' }).play(ctx, t.querySelector('.lg'));
      C({ color: '#1D1C1A' }, { color: '#6E6A64' }).play(ctx, t.querySelector('.tile-name'));
      C({ color: '#5E5B56' }, { color: '#6E6A64' }).play(ctx, t.querySelector('.tile-state'));
      const dot = t.querySelector('.dot.green');
      if (dot) {
        T(total).at(0, { backgroundColor: '#1E7A46', transform: 'scale(1)' })
          .to(p, p + D, { backgroundColor: '#B3AEA7', transform: 'scale(1)' }, EIO)
          .to(r, r + 160, { backgroundColor: '#B3AEA7', transform: R ? 'scale(1)' : 'scale(0.55)' }, EI)
          .to(r + 160, r + 160 + D, { backgroundColor: '#1E7A46', transform: 'scale(1)' }, EO).play(ctx, dot);
      }
      const sw = t.querySelector('.stw');
      if (sw) cycle(ctx, [sw.querySelector('.a'), sw.querySelector('.b')], 1, [[p, 0], [r, 1]], { dur: 460 });
    });
  });

  /* ---------- A5 Shade ---------- */
  Kit.register('#a5', (ctx) => {
    const total = loopOf(ctx), R = ctx.reduced;
    const ON = 700, OFF = 5400;
    pauseButton(ctx, ON, OFF, false);
    pauseHeader(ctx, ON + 200, OFF + 200);
    const shade = ctx.$('.shade');
    const up = 'translateY(-112%)';
    if (R) {
      T(total).at(0, { opacity: 0, transform: 'none' }).to(1000, 1500, { opacity: 1, transform: 'none' }, EIO)
        .to(OFF + 100, OFF + 500, { opacity: 0, transform: 'none' }, EIO).play(ctx, shade);
    } else {
      T(total).at(0, { opacity: 1, transform: up }).to(1000, 1900, { opacity: 1, transform: 'none' }, EIO)
        .to(OFF + 100, OFF + 760, { opacity: 1, transform: up }, EIO).play(ctx, shade);
    }
    T(total).at(0, { opacity: 0, transform: R ? 'none' : 'translateY(-10px)' })
      .to(1500, 2000, { opacity: 1, transform: 'none' }, EO)
      .to(OFF, OFF + 220, { opacity: 0, transform: 'none' }, EI).play(ctx, ctx.$('.shade-in'));
    if (!R) {
      T(total).at(0, { transform: 'scale(1)' }).to(OFF - 300, OFF - 180, { transform: 'scale(0.94)' }, EO)
        .to(OFF - 180, OFF + 100, { transform: 'scale(1)' }, EO).play(ctx, ctx.$('.shade .btn'));
    }
  });

  /* ---------- A6 Flag ---------- */
  Kit.register('#a6', (ctx) => {
    const total = loopOf(ctx), R = ctx.reduced;
    const ub = ctx.$('.tile[data-device="Ubuntu laptop"]');
    T(total).at(0, { backgroundColor: '#1E7A46' }).to(600, 1100, { backgroundColor: '#B42318' }, EIO).play(ctx, ub.querySelector('.ubdot'));
    const sw = ub.querySelector('.stw');
    cycle(ctx, [sw.querySelector('.a'), sw.querySelector('.b')], 0, [[600, 1]], { dur: 460 });
    twin(ctx, ctx.$('.hs'), [[900, 1]], { dur: 520 });

    const banner = ctx.$('.banner'), grid = ctx.$('.tiles');
    const d = banner.offsetHeight + 16;
    const S = 1500, E = 2100;
    if (R) {
      T(total).at(0, { opacity: 1, transform: `translateY(-${d}px)` })
        .to(S, S + 220, { opacity: 0, transform: `translateY(-${d}px)` }, EI)
        .to(S + 220, S + 220, { opacity: 0, transform: 'none' })
        .to(S + 240, S + 600, { opacity: 1, transform: 'none' }, EO).play(ctx, grid);
      T(total).at(0, { opacity: 0 }).to(S + 200, S + 700, { opacity: 1 }, EO).play(ctx, banner);
      return;
    }
    T(total).at(0, { transform: `translateY(-${d}px)` }).to(S, E, { transform: 'none' }, EIO).play(ctx, grid);
    T(total).at(0, { opacity: 0, clipPath: 'inset(0% 0% 100% 0% round 12px)' })
      .to(S, E, { opacity: 1, clipPath: 'inset(0% 0% 0% 0% round 12px)' }, EIO).play(ctx, banner);
    T(total).at(0, { opacity: 0, transform: 'translateY(4px)' }).to(S + 300, S + 800, { opacity: 1, transform: 'none' }, EO)
      .play(ctx, [banner.querySelector('.bn-text'), banner.querySelector('.btn')]);
    T(total).at(0, { strokeDashoffset: '94.25' }).to(S + 250, S + 1050, { strokeDashoffset: '0' }, EO).play(ctx, banner.querySelector('.bn-ring'));
    T(total).at(0, { opacity: 0 }).to(S + 850, S + 1150, { opacity: 1 }, EO).play(ctx, Array.from(banner.querySelectorAll('.bn-bang')));
    T(total).at(0, { opacity: 0, transform: 'scale(1)' })
      .to(S + 1100, S + 1400, { opacity: 0.45, transform: 'scale(1.15)' }, EO)
      .to(S + 1400, S + 2700, { opacity: 0, transform: 'scale(1.9)' }, EO).play(ctx, banner.querySelector('.bn-pulse'));
  });

  /* ---------- A7 Breathe and renew ---------- */
  Kit.register('#a7', (ctx) => {
    const total = loopOf(ctx), R = ctx.reduced;
    const RENEW = 8000;
    const text = ctx.$('.timer-t');
    const fmt = (s) => 'New code in 0:0' + s;
    text.textContent = fmt(8);
    for (let k = 1; k <= 8; k++) ctx.after(k * 1000, () => { text.textContent = fmt(8 - k); });
    ctx.after(RENEW + 450, () => { text.textContent = 'Works for 10 minutes'; });
    T(total).at(0, { opacity: 0 }).to(0, 350, { opacity: 1 }, EO)
      .to(RENEW + 250, RENEW + 450, { opacity: 0 }, EI).to(RENEW + 450, RENEW + 850, { opacity: 1 }, EO).play(ctx, text);

    T(total).at(0, { opacity: 0 }).to(0, 400, { opacity: 1 }, EO).to(RENEW + 1000, RENEW + 1600, { opacity: 0 }, EIO).play(ctx, ctx.$('.bar'));
    T(total).at(0, { transform: 'scaleX(0.267)', backgroundColor: '#FFFFFF' })
      .to(0, 5000, { transform: 'scaleX(0.1)', backgroundColor: '#FFFFFF' }, 'linear')
      .to(5000, RENEW, { transform: 'scaleX(0)', backgroundColor: '#FFD2CC' }, 'linear')
      .to(RENEW, RENEW + 800, { transform: 'scaleX(1)', backgroundColor: '#FFFFFF' }, EO).play(ctx, ctx.$('.bar-fill'));

    const qn = ctx.$('.q-new');
    if (R) {
      T(total).at(0, { opacity: 0 }).to(RENEW, RENEW + 600, { opacity: 1 }, EIO).play(ctx, qn);
    } else {
      T(total).at(0, { clipPath: 'inset(0% 0% 100% 0% round 12px)' })
        .to(RENEW, RENEW + 900, { clipPath: 'inset(0% 0% 0% 0% round 12px)' }, EIO).play(ctx, qn);
      const edge = ctx.$('.wipe-edge');
      T(total).at(0, { transform: 'translateY(0px)' }).to(RENEW, RENEW + 900, { transform: 'translateY(254px)' }, EIO).play(ctx, edge);
      T(total).at(0, { opacity: 0 }).to(RENEW, RENEW + 150, { opacity: 1 }, 'linear')
        .to(RENEW + 700, RENEW + 900, { opacity: 0 }, 'linear').play(ctx, edge);
    }
    ctx.$$('.dg').forEach((g, i) => {
      const s = RENEW + 250 + i * 60;
      const y = R ? 0 : 110;
      T(total).at(0, { opacity: 1, transform: 'translateY(0)' }).to(s, s + (R ? 300 : 380), { opacity: 0, transform: `translateY(-${y}%)` }, EIO).play(ctx, g.querySelector('.dg-o'));
      T(total).at(0, { opacity: 0, transform: `translateY(${y}%)` }).to(s + (R ? 320 : 0), s + (R ? 720 : 520), { opacity: 1, transform: 'translateY(0)' }, EO).play(ctx, g.querySelector('.dg-n')); // reduced: old digit goes first
    });
  });
})();

</script>
</body>
