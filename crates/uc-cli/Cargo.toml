[package]
name = "uc-cli"
description = "Universal Clipboard: the uc CLI, a full user interface that talks to the local agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "uc_cli"
path = "src/lib.rs"

[[bin]]
name = "uc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "io-util", "signal"] }
uc-agent = { version = "0.0.1", path = "../uc-agent" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
uc-winhost = { version = "0.0.1", path = "../../tools/winhost" }
