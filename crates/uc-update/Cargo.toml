[package]
name = "uc-update"
description = "Universal Clipboard: update check, signature check, rollout and rollback."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "uc-release"
path = "src/bin/uc-release.rs"

[dependencies]
blake2 = "0.10"
blake3 = "1.8.7"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
minisign-verify = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"
