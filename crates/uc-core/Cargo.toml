[package]
name = "uc-core"
description = "Universal Clipboard: clip model, wire codec, clock and sync state machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
png = "0.18.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
uc-clip = { version = "0.0.1", path = "../uc-clip" }

[dev-dependencies]
proptest = "1.12.0"
