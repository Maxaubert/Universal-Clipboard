[package]
name = "uc-pair"
description = "Universal Clipboard: PAKE pairing and the group membership chain."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
curve25519-dalek = "4"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
spake2 = "=0.4.0"
subtle = "2"
uc-keys = { version = "0.0.1", path = "../uc-keys" }
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
