[package]
name = "uc-clip-linux"
description = "Universal Clipboard: Linux clipboard backend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
uc-clip = { version = "0.0.1", path = "../uc-clip" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["event"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["xfixes"] }
