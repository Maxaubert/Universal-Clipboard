# Release (plan 8.4): on a tag vX.Y.Z, build every package (package.yml), then wait for Max's
# approval in the GitHub environment "release", sign latest.json with the updater key and
# make a DRAFT GitHub release. Max publishes the draft by hand.
#
# macOS: the job macos-signed builds the app again, signs it with Max's Developer ID and
# notarizes it (secrets of the "release" environment, see docs/install.md "Signing and
# notarization"). The release fails if signing or notarization fails: no ad-hoc fallback.
# The ad-hoc macOS build from package.yml is only tested, never released.
# Windows stays unsigned for now. The update manifest is signed only when the environment has
# the secret UCLIP_UPDATER_KEY; without it the release has no latest.json, so no installed
# app updates to it.
#
# Two jobs use the "release" environment (macos-signed early, publish at the end), so Max
# approves twice per release.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag must match Cargo.toml
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$tag" = "$cargo" ] || { echo "tag $tag != Cargo.toml $cargo"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  macos-signed:
    # Same build as the macos job in package.yml, but signed with Max's Developer ID and
    # notarized. No rust or npm cache: a job that holds the signing keys does not restore
    # caches that other runs wrote.
    needs: version
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      V: ${{ needs.version.outputs.version }}
      SIGN_IDENTITY: "Developer ID Application: MAX AUBERT (WV7BY8CUM8)"
      NOTARY_PROFILE: uc-notary
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --locked -p uc-agent -p uc-cli
      - name: Desktop window
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --no-bundle
      - run: cp apps/desktop/src-tauri/target/release/universal-clipboard target/release/
      - name: Import the Developer ID certificate and the notary key (temporary keychain)
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for n in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!n:-}" ] || { echo "::error::Secret $n is missing in the release environment (docs/install.md)"; exit 1; }
          done
          umask 077
          KC="$RUNNER_TEMP/uc-sign.keychain-db"
          KC_PASS=$(openssl rand -hex 24)
          echo "::add-mask::$KC_PASS"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          # The certificate and its private key. Only codesign may use the key.
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/uc-cert.p12"
          security import "$RUNNER_TEMP/uc-cert.p12" -k "$KC" -f pkcs12 -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/uc-cert.p12"
          # Apple's Developer ID intermediates, so the chain builds even if the .p12 lacks them.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KC" >/dev/null || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          # Put the keychain first in the search list, so codesign finds the identity.
          old=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KC" $old
          if ! security find-identity -v -p codesigning "$KC" | grep -qF "\"$SIGN_IDENTITY\""; then
            echo "::error::No valid identity \"$SIGN_IDENTITY\" in MACOS_CERT_P12"
            security find-identity -v -p codesigning "$KC" | sed 's/[0-9A-F]\{40\}/<hash>/'
            exit 1
          fi

          # The App Store Connect API key, stored as a notarytool profile in the same keychain
          # (store-credentials checks it with Apple first).
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/uc-notary.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --key "$RUNNER_TEMP/uc-notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --keychain "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/uc-notary.p8"
          echo "NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: App bundle, DMG, update archive (Developer ID, notarized, stapled)
        run: sh packaging/macos/build-app.sh "$V" target/release dist
      - name: Check signature, notarization and staple (app, DMG, update archive)
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/UniversalClipboard-$V-macos-aarch64.dmg"
          TAR="dist/UniversalClipboard-$V-macos-aarch64.app.tar.gz"
          check_app() {
            echo "== $1"
            codesign --verify --deep --strict --verbose=2 "$1"
            codesign -dvv "$1" 2>&1 | grep -F "Authority=$SIGN_IDENTITY"
            spctl -a -vv -t exec "$1" 2>&1 | tee /dev/stderr | grep -qF "source=Notarized Developer ID"
            xcrun stapler validate "$1"
            "$1/Contents/MacOS/uc" --version
            "$1/Contents/MacOS/uc-agent" --version
          }
          check_app "dist/Universal Clipboard.app"

          echo "== $DMG"
          hdiutil verify "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG" 2>&1 | tee /dev/stderr \
            | grep -qF "source=Notarized Developer ID"
          xcrun stapler validate "$DMG"
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          check_app "$MNT/Universal Clipboard.app"
          hdiutil detach "$MNT"

          # The update archive holds the contents of the bundle; unpacked it must still pass.
          X="$(mktemp -d)/Universal Clipboard.app"
          mkdir -p "$X"
          tar -xzf "$TAR" -C "$X"
          check_app "$X"
      - name: Remove the keychain and key files
        if: always()
        run: |
          KC="$RUNNER_TEMP/uc-sign.keychain-db"
          [ ! -e "$KC" ] || security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/uc-cert.p12" "$RUNNER_TEMP/uc-notary.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed
          path: |
            dist/*.dmg
            dist/*.app.tar.gz

  publish:
    needs: [version, package, macos-signed]
    runs-on: ubuntu-latest
    # Required reviewer (Max) and tags on the default branch only: set in the repo settings.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Windows and Linux from package.yml; macOS only from macos-signed (never the ad-hoc build).
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-signed
          path: dist
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: Sign latest.json (10% rollout)
        env:
          UCLIP_UPDATER_KEY: ${{ secrets.UCLIP_UPDATER_KEY }}
        run: |
          set -eu
          V=${{ needs.version.outputs.version }}
          rm -f dist/uc-release.exe
          if [ -z "${UCLIP_UPDATER_KEY:-}" ]; then
            echo "::warning::No UCLIP_UPDATER_KEY in the release environment: no latest.json, so no auto-update to this release."
            exit 0
          fi
          cargo build --release --locked -p uc-update --bin uc-release
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$V"
          ./target/release/uc-release manifest --version "$V" --rollout 10 --base-url "$BASE" --out dist/latest.json \
            "windows-x86_64:nsis:dist/UniversalClipboard-$V-windows-x64-setup.exe" \
            "macos-aarch64:tar:dist/UniversalClipboard-$V-macos-aarch64.app.tar.gz"
          ./target/release/uc-release verify dist/latest.json dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          V=${{ needs.version.outputs.version }}
          ls -la dist
          gh release create "v$V" dist/* --draft --verify-tag --title "Universal Clipboard $V" \
            --notes "macOS: signed with a Developer ID and notarized. Windows: unsigned, so SmartScreen shows a warning. See docs/install.md."
