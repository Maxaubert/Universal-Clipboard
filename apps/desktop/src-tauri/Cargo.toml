[package]
name = "uc-desktop"
version = "0.0.1"
description = "Universal Clipboard: the settings window (Tauri 2). It only talks to the local agent."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Maxaubert/Universal-Clipboard"
rust-version = "1.99"
publish = false

# Not a member of the root workspace: Linux CI would need WebKitGTK to build it.
[workspace]

[lib]
name = "uc_desktop"
path = "src/lib.rs"

[[bin]]
name = "universal-clipboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
uc-agent = { path = "../../../crates/uc-agent" }
uc-cli = { path = "../../../crates/uc-cli" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
